<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Accessibility Bubbles social share card</title>
  <desc id="desc">A glossy pastel bubble with the Accessibility Bubbles lettering inside and smaller bubbles floating around.</desc>
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9e4ff" />
      <stop offset="35%" stop-color="#e9f4ff" />
      <stop offset="100%" stop-color="#cdeafb" />
    </linearGradient>
    <radialGradient id="bubbleMain" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#f6d7ff" stop-opacity="0.92" />
      <stop offset="85%" stop-color="#9fc8ff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#63a9ff" stop-opacity="0.65" />
    </radialGradient>
    <radialGradient id="bubblePink" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#ffd9ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff7ed5" stop-opacity="0.7" />
    </radialGradient>
    <radialGradient id="bubbleBlue" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#c8f6ff" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#4ca0ff" stop-opacity="0.75" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur" />
      <feComposite in="blur" in2="SourceAlpha" operator="arithmetic" k2="1" k3="-0.25" result="composite" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#3b1a64" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradient)" />

  <g filter="url(#softGlow)" transform="translate(30 -10)">
    <ellipse cx="600" cy="340" rx="360" ry="300" fill="url(#bubbleMain)" />
    <ellipse cx="420" cy="180" rx="140" ry="120" fill="url(#bubblePink)" opacity="0.85" />
    <ellipse cx="870" cy="180" rx="130" ry="115" fill="url(#bubbleBlue)" opacity="0.8" />
    <ellipse cx="960" cy="420" rx="90" ry="82" fill="url(#bubblePink)" opacity="0.7" />
    <ellipse cx="350" cy="430" rx="110" ry="95" fill="url(#bubbleBlue)" opacity="0.75" />
    <ellipse cx="250" cy="295" rx="72" ry="64" fill="url(#bubblePink)" opacity="0.75" />
    <ellipse cx="1030" cy="290" rx="68" ry="61" fill="url(#bubbleBlue)" opacity="0.72" />
  </g>

  <g filter="url(#textShadow)">
    <text x="600" y="320" font-family="'Baloo 2', 'Fredoka', 'Nunito', 'Arial Rounded MT Bold', 'Arial', sans-serif" font-size="120" font-weight="900" text-anchor="middle" letter-spacing="-1" fill="#fffc54" stroke="#3b1a64" stroke-width="12" paint-order="stroke">
      Accessibility
    </text>
    <text x="600" y="420" font-family="'Baloo 2', 'Fredoka', 'Nunito', 'Arial Rounded MT Bold', 'Arial', sans-serif" font-size="160" font-weight="900" text-anchor="middle" letter-spacing="-2" fill="#ffd4ff" stroke="#3b1a64" stroke-width="16" paint-order="stroke">
      Bubbles
    </text>
  </g>

  <text x="600" y="525" fill="#3b1a64" font-family="'Atkinson Hyperlegible', 'Nunito', 'Arial', sans-serif" font-size="40" font-weight="700" text-anchor="middle" opacity="0.85">
    accessibilitybubbles.com
  </text>
</svg>
